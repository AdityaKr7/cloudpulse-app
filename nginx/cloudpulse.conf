# Nginx Reverse Proxy Configuration for CloudPulse on Ubuntu EC2
# File location on EC2: /etc/nginx/sites-available/cloudpulse
# Enabled via: sudo ln -s /etc/nginx/sites-available/cloudpulse /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;

    # Replace with your Elastic IP / Public IP or Domain Name (e.g., example.com www.example.com)
    server_name YOUR_EC2_PUBLIC_IP_OR_DOMAIN;

    # Maximum allowed request body size (e.g. for file uploads)
    client_max_body_size 20M;

    # Gzip compression for high-performance response times
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Forward traffic to Node.js / Express running via PM2 on port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass real client information to Node.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets caching optimization (optional if served via Nginx directly)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        proxy_pass http://127.0.0.1:5000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
